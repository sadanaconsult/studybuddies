<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor Buddy prototype</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 16px;background:#fafaf7;color:#222}
 .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px 18px;margin:16px 0}
 button{font-size:1.05rem;padding:10px 18px;border-radius:8px;border:0;background:#3b6fd4;color:#fff;cursor:pointer}
 a.btn{display:inline-block;font-size:1.05rem;padding:10px 18px;border-radius:8px;background:#e8eefb;color:#1d3c85;text-decoration:none}
 small{color:#666}
</style></head><body>
<h1>Tutor Buddy</h1>
<p>Prototype: adding fractions with the same denominator. Demo data only.</p>
<div class="card"><h2>Child view</h2>
 <p>Start a new lesson with the demo child.</p>
 <form method="post" action="/demo/start"><button>Start a lesson</button></form></div>
<div class="card"><h2>Parent view</h2>
 <p>See what the demo child did with help and what they did on their own.</p>
 <a class="btn" href="/demo/parent">Open parent view</a></div>
<p><small>Prototype for review. Not for real children's data.</small></p>
</body></html>
