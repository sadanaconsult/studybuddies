databases:
  - name: tutorbuddy-db
    plan: free
    databaseName: tutorbuddy
    user: tutorbuddy

services:
  - type: web
    name: tutorbuddy-api
    runtime: python
    plan: free
    buildCommand: pip install -r services/api/requirements.txt
    startCommand: cd services/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: tutorbuddy-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false        # paste in the Render dashboard; never commit
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: DEMO_PASSWORD
        sync: false        # shared password for the demo URL
